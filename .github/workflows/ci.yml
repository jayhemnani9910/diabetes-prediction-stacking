name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.14.0
      - run: ruff check project.ipynb tests

  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run every cell
        run: jupyter nbconvert --to notebook --execute project.ipynb --output-dir out --ExecutePreprocessor.timeout=1800
      - name: Compare test accuracies with the README
        run: python tests/check_results.py out/project.ipynb
